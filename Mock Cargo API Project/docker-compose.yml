services:
  postgres:
    image: postgres:16
    container_name: mock-cargo-postgres
    environment:
      POSTGRES_DB: mock_cargo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mock_cargo_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-cargo-api:
    build: .
    container_name: mock-cargo-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app

volumes:
  postgres_data:
